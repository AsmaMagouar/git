<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Best Sellers</h1>

    <div class="product">
        <div class="thumb"><img src="produit.jpeg" alt="" width="100" height="100"></div>

        <div class="info">
            <h3>Wireless Headphones</h3>
            <p>30 hours of battery, comfortable fit.</p>
        </div>

        <div class="buy">
            <p class="price">$49</p>
            <a class="btn" href="#">Add to cart</a>
        </div>
    </div>

    <div class="product">
        <div class="thumb"><img src="smart.jpeg" alt="" height="100" width="100"></div>

        <div class="info">
            <h3>Smart Watch</h3>
            <p>Heart rate, sleep tracking and GPS.</p>
        </div>

        <div class="buy">
            <p class="price">$89</p>
            <a class="btn" href="#">Add to cart</a>
        </div>
    </div>

</body>
</html>
